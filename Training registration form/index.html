<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Training Program Registration</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <h1>Training Program Registration</h1>
        <p>Choose a course and start learning today</p>
    </header>

    <div class="main">

        <div class="welcome-box">
            <div class="welcome-text">
                <h2>Upgrade Your Skills</h2>
                <p>
                    Register for a programming training program
                    and improve your coding knowledge.
                </p>
            </div>

            <img src="student.png" alt="students learning">
        </div>

        <div class="form-box">
            <h2>Registration Form</h2>

            <form id="registrationForm">

                <div class="row">
                    <div class="field">
                        <label for="name">Full Name</label>
                        <input type="text" id="name" placeholder="Enter your name" required>
                    </div>

                    <div class="field">
                        <label for="age">Age</label>
                        <input type="number" id="age" placeholder="Enter your age" required>
                    </div>
                </div>

                <div class="row">
                    <div class="field">
                        <label for="email">Email</label>
                        <input type="email" id="email" placeholder="Enter your email" required>
                    </div>

                    <div class="field">
                        <label for="phone">Phone Number</label>
                        <input type="tel" id="phone" placeholder="Enter phone number" required>
                    </div>
                </div>

                <label for="language">Programming Language</label>
                <select id="language" required>
                    <option value="">Choose a language</option>
                    <option value="C">C</option>
                    <option value="C++">C++</option>
                    <option value="Java">Java</option>
                    <option value="Python">Python</option>
                </select>

                <label for="mode">Training Mode</label>
                <select id="mode" required>
                    <option value="">Choose training mode</option>
                    <option value="Online">Online</option>
                    <option value="Offline">Offline</option>
                </select>

                <label for="level">Experience Level</label>
                <select id="level" required>
                    <option value="">Choose your level</option>
                    <option value="Beginner">Beginner</option>
                    <option value="Intermediate">Intermediate</option>
                </select>

                <button type="submit">Register Now</button>

            </form>
        </div>

    </div>

    <script src="script.js"></script>
</body>
</html>
